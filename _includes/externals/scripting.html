<!-- kramdown 会把数学公式输出成 <script type="math/tex">,MathJax 3 不再识别,这里先还原成普通文本节点 -->
<script>
  (function () {
    var nodes = document.querySelectorAll('script[type^="math/tex"]');
    for (var i = nodes.length - 1; i >= 0; i--) {
      var node = nodes[i];
      var display = node.type.indexOf('display') !== -1;
      var span = document.createElement('span');
      span.textContent = (display ? '$$' : '$') + node.textContent + (display ? '$$' : '$');
      node.parentNode.replaceChild(span, node);
    }
  })();
</script>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
